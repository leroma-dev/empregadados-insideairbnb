name: Documentação (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar uv e Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Instalar o MkDocs
        run: uv sync --only-group docs

      - name: "Gerar o site (modo estrito: aviso vira erro)"
        run: uv run mkdocs build --strict

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
